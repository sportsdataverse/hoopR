reference:
  - title: hoopR Data
  - subtitle: Loaders Family Overview
    desc: hoopR loader family overview (NBA + MBB release loaders)
    contents:
      - '`hoopR_loaders`'
  - subtitle: NBA Data Functions
    desc: Functions exported by hoopR to access the hoopR-data repository's NBA Data
    contents:
      - '`load_nba_pbp`'
      - '`load_nba_team_box`'
      - '`load_nba_player_box`'
      - '`load_nba_schedule`'
      - '`load_nba_standings`'
      - '`load_nba_draft`'
      - '`load_nba_rosters`'
      - '`load_nba_player_stats`'
      - '`load_nba_team_stats`'
      - '`load_nba_game_rosters`'
      - '`load_nba_officials`'
      - '`update_nba_db`'
  - subtitle: Men's College Basketball Data Functions
    desc: Functions exported by hoopR to access the hoopR-data repository's Men's College Basketball Data
    contents:
      - '`load_mbb_pbp`'
      - '`load_mbb_team_box`'
      - '`load_mbb_player_box`'
      - '`load_mbb_schedule`'
      - '`load_mbb_standings`'
      - '`load_mbb_rosters`'
      - '`load_mbb_player_stats`'
      - '`load_mbb_team_stats`'
      - '`load_mbb_game_rosters`'
      - '`load_mbb_officials`'
      - '`update_mbb_db`'
  - title: Cross-Source Crosswalks
  - subtitle: NBA Crosswalk Functions
    desc: Cross-source team/schedule/player crosswalks linking ESPN, NBA Stats, and Fox identities (keyed on espn_team_id), plus cached loaders
    contents:
      - '`nba_team_crosswalk`'
      - '`nba_schedule_crosswalk`'
      - '`nba_player_crosswalk`'
      - '`load_nba_team_crosswalk`'
      - '`load_nba_schedule_crosswalk`'
      - '`load_nba_player_crosswalk`'
  - subtitle: MBB Crosswalk Functions
    desc: Cross-source team/schedule/player crosswalks linking ESPN, KenPom (teams_links), Torvik, and Fox identities (keyed on espn_team_id), plus cached loaders
    contents:
      - '`mbb_team_crosswalk`'
      - '`mbb_schedule_crosswalk`'
      - '`mbb_player_crosswalk`'
      - '`load_mbb_team_crosswalk`'
      - '`load_mbb_schedule_crosswalk`'
      - '`load_mbb_player_crosswalk`'
  - title: ESPN Data
  - subtitle: ESPN Family Overview
    desc: ESPN basketball endpoint family overview (NBA + MBB)
    contents:
      - '`espn_basketball`'
  - subtitle: Men's College Basketball Data Functions
    desc: Functions exported by hoopR to access ESPN Men's College Basketball Data
    contents:
      - starts_with("espn_mbb_")
  - subtitle: NBA Data Functions
    desc: Functions exported by hoopR to access ESPN's NBA Data
    contents:
      - starts_with("espn_nba_")
  - subtitle: Fox Sports Basketball Data Functions
    desc: Read-only Fox Sports (Bifrost) NBA + MBB wrappers (play-by-play, boxscore, odds, roster, stats, game log, standings, leaders)
    contents:
      - starts_with("fox_")
  - title: NBA Data
  - subtitle: NBA Stats Family Overview
    desc: NBA Stats API endpoint family overview
    contents:
      - '`nba_stats`'
  - subtitle: Basketball Analytics Utilities
    desc: >
      Pure, vectorized efficiency / rating / four-factor calculators and
      box-score scaling / enrichment helpers (no network calls; league-agnostic).
    contents:
      - '`nba_true_shooting_pct`'
      - '`nba_effective_fg_pct`'
      - '`nba_ft_rate`'
      - '`nba_game_score`'
      - '`nba_assist_to_turnover`'
      - '`nba_possessions`'
      - '`nba_pace`'
      - '`nba_offensive_rating`'
      - '`nba_defensive_rating`'
      - '`nba_net_rating`'
      - '`nba_usage_rate`'
      - '`nba_assist_pct`'
      - '`nba_turnover_pct`'
      - '`nba_oreb_pct`'
      - '`nba_four_factors`'
      - '`nba_per_minutes`'
      - '`nba_per_possessions`'
      - '`nba_add_advanced_metrics`'
  - subtitle: NBA Dictionaries & Media
    desc: Player / team dictionaries and CDN headshot / logo URL helpers.
    contents:
      - '`nba_player_dict`'
      - '`nba_team_dict`'
      - '`nba_player_headshot_url`'
      - '`nba_team_logo_url`'
  - subtitle: NBA Result-Set Helpers
    desc: >
      Reduce the named list of result sets an `nba_*()` wrapper returns to a
      single tibble -- row-bind (B), join/widen (C) or nest (D).
    contents:
      - '`nba_bind_sets`'
      - '`nba_join_sets`'
      - '`nba_nest_sets`'
  - subtitle: NBA Combined Datasets
    desc: >
      Dataset-specific wrappers that fetch a multi-result-set endpoint and apply
      its canonical reduction in one call (the per-dataset equivalent of the
      generic result-set helpers).
    contents:
      - '`nba_tidy_franchise_history`'
      - '`nba_tidy_boxscore`'
      - '`nba_tidy_player_profile`'
  - subtitle: NBA Stats API
    desc: Functions exported by hoopR to access the NBA Stats API
    contents:
      - starts_with("nba_")
  - subtitle: NBA G-League Stats API
    desc: Functions exported by hoopR to access the NBA G-League Stats API
    contents:
      - starts_with("nbagl_")
  - title: NCAA Data
  - subtitle: NCAA Data Functions
    desc: Functions exported by hoopR to access NCAA Men's College Basketball Data
    contents:
      - starts_with("ncaa_")
  - title: KenPom Data
  - subtitle: KenPom Family Overview
    desc: KenPom scraper overview
    contents:
      - '`kp`'
  - subtitle: KenPom Data Functions
    desc: Functions exported by hoopR
    contents:
      - starts_with("kp_")
  - title: CollegeBasketballData (CBD)
  - subtitle: CBD API Key Registration
    desc: Registering your CollegeBasketballData API key
    contents:
      - '`register_cbbd`'
  - subtitle: CBD Data Functions
    desc: Functions exported by hoopR to access the CollegeBasketballData API
    contents:
      - starts_with("cbbd_")
  - title: Bart Torvik (T-Rank)
  - subtitle: Torvik Data Functions
    desc: Functions exported by hoopR to access Bart Torvik (barttorvik.com) data
    contents:
      - starts_with("torvik_")
  - title: Injury Reports
  - subtitle: NBA Injury Functions
    desc: >
      Current NBA injury reports. RotoWire is the live replacement for the
      defunct RotoWorld feed; Basketball-Reference offers a second source.
    contents:
      - '`rotowire_injuries`'
      - '`bref_injuries`'
  - title: Basketball-Reference
  - subtitle: Basketball-Reference Functions
    desc: Functions exported by hoopR to scrape basketball-reference.com
    contents:
      - starts_with("bref_")
  - title: Salary & Mock Draft Sources
  - subtitle: Salary & Draft Functions
    desc: Functions exported by hoopR to scrape Spotrac, HoopsHype, and NBADraft.net
    contents:
      - starts_with("spotrac_")
      - starts_with("hoopshype_")
      - starts_with("nbadraft_")
  - title: RealGM
  - subtitle: RealGM Functions
    desc: >
      Functions exported by hoopR to access basketball.realgm.com. RealGM sits
      behind a Cloudflare browser challenge, so these require the optional
      chromote package and Google Chrome.
    contents:
      - starts_with("realgm_")
  - title: Helper Functions and Data
  - subtitle: Included data
    desc: Data included within the package
    contents:
      - '`teams_links`'
  - subtitle: hoopR Helper Functions
    desc: Internal functions used by hoopR
    contents:
      - '`login`'
      - '`check_status`'
      - '`clean_team_names_NCAA_merge`'
      - '`csv_from_url`'
      - '`rds_from_url`'
      - '`rejoin_schedules`'
      - '`most_recent_mbb_season`'
      - '`most_recent_nba_season`'
      - '`progressively`'
      - '`year_to_season`'
      - '`request_with_proxy`'
      - '`helper_espn_nba_pbp`'
      - '`helper_espn_nba_team_box`'
      - '`helper_espn_nba_player_box`'
      - '`helper_espn_mbb_pbp`'
      - '`helper_espn_mbb_team_box`'
      - '`helper_espn_mbb_player_box`'
      - '`.players_on_court`'
      - '`.players_on_court_v3`'
      - '`.v3_to_v2_format`'
      - '`.build_player_roster`'
